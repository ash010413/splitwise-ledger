[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "splitwise-ledger"
version = "0.1.0"
description = "Personal Splitwise share tracking with explicit category review"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "authlib>=1.3,<2", "cryptography>=43", "pydantic-settings>=2.5,<3",
]

[project.optional-dependencies]
cloud = ["google-cloud-firestore>=2.21,<3", "google-auth>=2.40,<3", "requests>=2.32,<3"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "google-cloud-firestore>=2.21,<3", "requests>=2.32,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
